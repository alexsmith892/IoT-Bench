name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Zephyr contract gates (canonical task set + Renode regen drift)
        run: python -m unittest tests.test_canonical_task_set tests.test_renode_regen_drift
      - name: Run offline tests
        run: python -m unittest discover tests
