- delay: 200ms
- set-control:
    part-id: imu1
    control: accelZ
    value: 1.0
- delay: 250ms
- set-control:
    part-id: imu1
    control: accelZ
    value: 1.9
- delay: 200ms
- set-control:
    part-id: imu1
    control: accelZ
    value: 1.0
- delay: 250ms
- set-control:
    part-id: imu1
    control: accelZ
    value: 1.9
- delay: 200ms
- set-control:
