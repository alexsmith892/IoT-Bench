task_id: sensor_water_level_display
name: Display analog water level as LCD bar graph
platform: esp32s3_espidf
level: level3
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '38'
    - signal: D1
      pin: '39'
    - signal: D2
      pin: '40'
    - signal: D3
      pin: '41'
    - signal: D4
      pin: '42'
    - signal: D5
      pin: '21'
  components:
  - type: water_level_surrogate
    id: pot1
    pin: '9'
  - type: lcd1602
    id: lcd1
    pins:
      rs: '38'
      e: '39'
      d4: '40'
      d5: '41'
      d6: '42'
      d7: '21'
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
  - value: 0.15
    duration_ms: 450
  - value: 0.9
    duration_ms: 650
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - adc_oneshot_read\s*\(
      - gpio_set_level\s*\(
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: lcd_text_sequence
    params:
      frames:
      - expected_texts:
        - Water Level
      - expected_texts:
        - '####'
simulation:
  timeout_ms: 1800
case:
  id: sensor-water-level-display-wokwi-esp32s3-espidf
  sketch_name: sensor_water_level_display
board:
  type: board-esp32-s3-devkitc-1
