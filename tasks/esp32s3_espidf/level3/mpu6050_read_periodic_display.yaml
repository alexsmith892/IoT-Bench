task_id: mpu6050_read_periodic_display
name: Read MPU6050 every 100 ms, average 10 samples, display on LCD
platform: esp32s3_espidf
level: level3
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '38'
    - signal: D1
      pin: '39'
    - signal: D2
      pin: '40'
    - signal: D3
      pin: '41'
    - signal: D4
      pin: '42'
    - signal: D5
      pin: '21'
  components:
  - type: button
    id: btn1
    pin: '2'
  - type: mpu6050
    id: imu1
    pins:
      sda: '9'
      scl: '10'
  - type: lcd1602
    id: lcd1
    pins:
      rs: '38'
      e: '39'
      d4: '40'
      d5: '41'
      d6: '42'
      d7: '21'
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
  - part_id: imu1
    control: accelX
    value: 0.0
    duration_ms: 50
  - part_id: imu1
    control: accelZ
    value: 1.0
    duration_ms: 650
  - part_id: imu1
    control: accelX
    value: 0.5
    duration_ms: 50
  - part_id: imu1
    control: rotationX
    value: 30
    duration_ms: 1500
simulation_variants:
- id: half_g
- id: one_and_half_g
  scenario:
    family: control_sequence
    initial_delay_ms: 200
    controls:
    - part_id: imu1
      control: accelX
      value: 0.0
      duration_ms: 50
    - part_id: imu1
      control: accelZ
      value: 1.0
      duration_ms: 650
    - part_id: imu1
      control: accelX
      value: 1.5
      duration_ms: 50
    - part_id: imu1
      control: rotationX
      value: 60
      duration_ms: 1500
  validator:
    checks:
    - {}
    - params:
        frames:
        - expected_texts:
          - 'Accel:'
          - 'Gyro:'
          expected_regexps:
          - Accel:\s*-?[0-9]{1,3}\b
        - expected_texts:
          - 'Accel:'
          - 'Gyro:'
          expected_regexps:
          - Accel:\s*2[45][0-9]{3}
          - Gyro:\s*(7[5-9][0-9]{2}|8[01][0-9]{2})
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - i2c_
      - esp_timer_get_time\s*\(
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: lcd_text_sequence
    params:
      frames:
      - expected_texts:
        - 'Accel:'
        - 'Gyro:'
        expected_regexps:
        - Accel:\s*-?[0-9]{1,3}\b
      - expected_texts:
        - 'Accel:'
        - 'Gyro:'
        expected_regexps:
        - Accel:\s*8[0-3][0-9]{2}
        - Gyro:\s*(3[89][0-9]{2}|40[0-9]{2})
simulation:
  timeout_ms: 2900
  require_distinct_variant_outputs: true
case:
  id: mpu6050-read-periodic-display-wokwi-esp32s3-espidf
  sketch_name: mpu6050_read_periodic_display
board:
  type: board-esp32-s3-devkitc-1
