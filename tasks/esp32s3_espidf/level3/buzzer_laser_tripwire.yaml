task_id: buzzer_laser_tripwire
name: Trigger buzzer when laser beam to photoresistor is blocked
platform: esp32s3_espidf
level: level3
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '10'
    - signal: D1
      pin: '11'
  components:
  - type: laser
    id: laser1
    pin: '10'
  - type: photoresistor_surrogate
    id: pot1
    pin: '9'
  - type: active_buzzer
    id: buzzer1
    pin: '11'
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
  - value: 0.9
    duration_ms: 350
  - value: 0.1
    duration_ms: 350
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
      required_patterns:
      - adc_oneshot_read\s*\(
      - gpio_set_level\s*\(
  - family: window_ratios
    params:
      channel: D0
      windows:
      - start_s: 0.2
        end_s: 0.9
        ratio_range:
        - 0.8
        - 1.0
  - family: stimulus_to_output
    params:
      channel: D1
      active_windows_s:
      - - 0.7
        - 0.9
      inactive_windows_s:
      - - 0.3
        - 0.5
      active_ratio_min: 0.4
simulation:
  timeout_ms: 1200
case:
  id: buzzer-laser-tripwire-wokwi-esp32s3-espidf
  sketch_name: buzzer_laser_tripwire
board:
  type: board-esp32-s3-devkitc-1
