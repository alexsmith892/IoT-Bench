task_id: mpu6050_read_button_display
name: Read MPU6050 on button interrupt and display accel/gyro on LCD
platform: esp32s3_espidf
level: level3
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '38'
    - signal: D1
      pin: '39'
    - signal: D2
      pin: '40'
    - signal: D3
      pin: '41'
    - signal: D4
      pin: '42'
    - signal: D5
      pin: '10'
  components:
  - type: button
    id: btn1
    pin: '38'
  - type: mpu6050
    id: imu1
    pins:
      sda: '9'
      scl: '10'
  - type: lcd1602
    id: lcd1
    pins:
      rs: '38'
      e: '39'
      d4: '40'
      d5: '41'
      d6: '42'
      d7: '10'
scenario:
  family: timeline
  steps:
  - delay_ms: 200
  - set_control:
      part_id: imu1
      control: accelX
      value: 0.0
  - set_control:
      part_id: imu1
      control: accelZ
      value: 1.0
  - delay_ms: 300
  - set_control:
      part_id: btn1
      control: pressed
      value: 1
  - delay_ms: 100
  - set_control:
      part_id: btn1
      control: pressed
      value: 0
  - delay_ms: 600
  - set_control:
      part_id: imu1
      control: accelX
      value: 0.5
  - set_control:
      part_id: imu1
      control: rotationX
      value: 30
  - delay_ms: 200
  - set_control:
      part_id: btn1
      control: pressed
      value: 1
  - delay_ms: 100
  - set_control:
      part_id: btn1
      control: pressed
      value: 0
  - delay_ms: 600
simulation_variants:
- id: half_g
- id: one_and_half_g
  scenario:
    family: timeline
    steps:
    - delay_ms: 200
    - set_control:
        part_id: imu1
        control: accelX
        value: 0.0
    - set_control:
        part_id: imu1
        control: accelZ
        value: 1.0
    - delay_ms: 300
    - set_control:
        part_id: btn1
        control: pressed
        value: 1
    - delay_ms: 100
    - set_control:
        part_id: btn1
        control: pressed
        value: 0
    - delay_ms: 600
    - set_control:
        part_id: imu1
        control: accelX
        value: 1.5
    - set_control:
        part_id: imu1
        control: rotationX
        value: 60
    - delay_ms: 200
    - set_control:
        part_id: btn1
        control: pressed
        value: 1
    - delay_ms: 100
    - set_control:
        part_id: btn1
        control: pressed
        value: 0
    - delay_ms: 600
  validator:
    checks:
    - {}
    - params:
        frames:
        - expected_texts:
          - 'Accel:'
          - 'Gyro:'
          expected_regexps:
          - Accel:\s*-?[0-9]{1,3}\b
        - expected_texts:
          - 'Accel:'
          - 'Gyro:'
          expected_regexps:
          - Accel:\s*2[45][0-9]{3}
          - Gyro:\s*(7[5-9][0-9]{2}|8[01][0-9]{2})
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - i2c_
      - gpio_get_level\s*\(
      required_any_patterns:
      - - attachInterrupt
        - digitalPinToInterrupt
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: lcd_text_sequence
    params:
      frames:
      - expected_texts:
        - 'Accel:'
        - 'Gyro:'
        expected_regexps:
        - Accel:\s*-?[0-9]{1,3}\b
      - expected_texts:
        - 'Accel:'
        - 'Gyro:'
        expected_regexps:
        - Accel:\s*8[0-3][0-9]{2}
        - Gyro:\s*(3[89][0-9]{2}|40[0-9]{2})
simulation:
  timeout_ms: 2700
case:
  id: mpu6050-read-button-display-wokwi-esp32s3-espidf
  sketch_name: mpu6050_read_button_display
board:
  type: board-esp32-s3-devkitc-1
