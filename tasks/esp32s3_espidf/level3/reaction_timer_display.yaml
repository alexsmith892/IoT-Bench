task_id: reaction_timer_display
name: Start timer by button, stop by shock sensor, display milliseconds
platform: esp32s3_espidf
level: level3
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '38'
    - signal: D1
      pin: '39'
    - signal: D2
      pin: '40'
    - signal: D3
      pin: '41'
    - signal: D4
      pin: '42'
    - signal: D5
      pin: '21'
  components:
  - type: button
    id: btn1
    pin: '12'
  - type: shock_sensor
    id: shock1
    pin: '14'
  - type: lcd1602
    id: lcd1
    pins:
      rs: '38'
      e: '39'
      d4: '40'
      d5: '41'
      d6: '42'
      d7: '21'
scenario:
  family: timeline
  steps:
  - delay_ms: 200
  - set_control:
      part_id: btn1
      control: pressed
      value: 1
  - delay_ms: 100
  - set_control:
      part_id: btn1
      control: pressed
      value: 0
  - delay_ms: 250
  - set_control:
      part_id: shock1
      control: pressed
      value: 1
  - delay_ms: 150
simulation_variants:
- id: quick_reaction
- id: slow_reaction
  scenario:
    family: timeline
    steps:
    - delay_ms: 200
    - set_control:
        part_id: btn1
        control: pressed
        value: 1
    - delay_ms: 100
    - set_control:
        part_id: btn1
        control: pressed
        value: 0
    - delay_ms: 600
    - set_control:
        part_id: shock1
        control: pressed
        value: 1
    - delay_ms: 150
  validator:
    checks:
    - {}
    - params:
        expected_regexps:
        - \b(6[4-9][0-9]|7[0-9]{2}|8[0-4][0-9])\s*ms
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - gpio_get_level\s*\(
      - esp_timer_get_time\s*\(
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: lcd_text
    params:
      expected_texts:
      - ms
      # Quick-reaction window. The measured interval lands near 0.30 s with a
      # few ms of poll/init jitter, so the floor is widened to 250 ms to stay
      # off the boundary while remaining clearly distinct from the slow variant
      # (>=640 ms). A fixed hardcoded value cannot satisfy both variants.
      expected_regexps:
      - \b(2[5-9][0-9]|3[0-9]{2}|4[0-4][0-9])\s*ms
simulation:
  timeout_ms: 1500
case:
  id: reaction-timer-display-wokwi-esp32s3-espidf
  sketch_name: reaction_timer_display
board:
  type: board-esp32-s3-devkitc-1
