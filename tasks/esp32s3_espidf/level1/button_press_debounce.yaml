task_id: button_press_debounce
name: Debounce an active-low button and print one trigger per intended press on ESP32-S3
platform: esp32s3_espidf
level: level1
board:
  type: board-esp32-s3-devkitc-1
fixture:
  family: button_serial
  pins:
    button: "12"
  button_attrs:
    bounce: "0"
scenario:
  family: bounced_button_sequence
  part_id: btn1
  initial_delay_ms: 700
  final_delay_ms: 250
  sequence:
    - value: 1
      duration_ms: 1
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 2
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 300
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 250
simulation_variants:
  - id: two_presses
  - id: three_presses
    scenario:
      family: bounced_button_sequence
      part_id: btn1
      initial_delay_ms: 700
      final_delay_ms: 250
      sequence:
        - {value: 1, duration_ms: 1}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 2}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 250}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
    validator:
      checks:
        - {}
        - params:
            expected_triggers: 3
static_checks:
  required_patterns: ["gpio_get_level\\s*\\(", "esp_timer_get_time\\s*\\("]
validator:
  family: composite
  checks:
    - family: static_checks
    - family: debounce_serial
      params:
        expected_text: "Button Pressed!"
        expected_triggers: 2
simulation:
  timeout_ms: 2600
  require_distinct_variant_outputs: true
case:
  id: button-press-debounce-wokwi-esp32s3-espidf
  sketch_name: button_press_debounce
