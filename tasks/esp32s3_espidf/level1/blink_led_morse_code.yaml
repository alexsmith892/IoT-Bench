task_id: blink_led_morse_code
name: Blink SOS in Morse code on ESP32-S3 GPIO 10
platform: esp32s3_espidf
level: level1
board:
  type: board-esp32-s3-devkitc-1
fixture:
  family: single_led_output
  pins:
    led: "10"
  analyzer:
    channels:
      - signal: D0
        pin: "10"
validator:
