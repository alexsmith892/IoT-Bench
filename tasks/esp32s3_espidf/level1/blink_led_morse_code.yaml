    high_units: [1, 1, 1, 3, 3, 3, 1, 1, 1]
    gap_units: [1, 1, 3, 1, 1, 3, 1, 1]
simulation:
  timeout_ms: 8000
case:
  id: blink-led-morse-code-wokwi-esp32s3-espidf
  sketch_name: blink_led_morse_code

