task_id: blink_two_leds
name: Blink two LEDs at 1 Hz and 2 Hz without blocking delay calls on ESP32-S3
platform: esp32s3_espidf
level: level1
board:
  type: board-esp32-s3-devkitc-1
fixture:
  family: dual_led_output
  pins:
    led1: "10"
    led2: "11"
  analyzer:
    channels:
      - signal: D0
        pin: "10"
      - signal: D1
        pin: "11"
static_checks:
  forbidden_calls: [vTaskDelay, vTaskDelayUntil, esp_rom_delay_us, ets_delay_us, sleep, usleep]
validator:
  family: no_delay_static_plus_waveform
  params:
    channels:
      D0:
        frequency_hz: 1.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.475, 0.525]
        full_period_range_s: [0.95, 1.05]
        duty_cycle_range: [0.45, 0.55]
      D1:
        frequency_hz: 2.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.2375, 0.2625]
        full_period_range_s: [0.475, 0.525]
        duty_cycle_range: [0.45, 0.55]
simulation:
  timeout_ms: 5000
case:
  id: blink-two-leds-wokwi-esp32s3-espidf
  sketch_name: blink_two_leds

