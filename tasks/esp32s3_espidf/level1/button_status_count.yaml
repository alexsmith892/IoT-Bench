task_id: button_status_count
name: Count active-low button presses and print the count on ESP32-S3
platform: esp32s3_espidf
level: level1
board:
  type: board-esp32-s3-devkitc-1
fixture:
  family: button_serial
  pins:
    button: "12"
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 700
  presses:
    - duration_ms: 160
      after_ms: 220
    - duration_ms: 160
      after_ms: 220
    - duration_ms: 160
      after_ms: 220
validator:
  family: serial_count_sequence
  params:
    expected_count: 3
    match_mode: exact_sequence
    line_pattern: ^\s*(\d+)\s*$
simulation:
  timeout_ms: 2200
case:
  id: button-status-count-wokwi-esp32s3-espidf
  sketch_name: button_status_count
