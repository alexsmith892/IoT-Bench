task_id: buzzer_doorbell
name: Turn on a buzzer while a button is pressed on ESP32-S3
platform: esp32s3_espidf
level: level1
board:
  type: board-esp32-s3-devkitc-1
fixture:
  family: button_to_buzzer
  pins:
    button: "12"
    buzzer: "13"
  analyzer:
    channels:
      - signal: D0
        pin: "13"
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 700
  presses:
    - duration_ms: 300
      after_ms: 300
    - duration_ms: 300
      after_ms: 300
validator:
  family: stimulus_to_output
  params:
    channel: D0
    active_windows_s: [[0.75, 0.95], [1.35, 1.55]]
    inactive_windows_s: [[0.25, 0.65], [1.05, 1.25], [1.65, 1.85]]
    active_ratio_min: 0.8
    inactive_ratio_max: 0.2
simulation:
  timeout_ms: 2200
case:
  id: buzzer-doorbell-wokwi-esp32s3-espidf
  sketch_name: buzzer_doorbell
