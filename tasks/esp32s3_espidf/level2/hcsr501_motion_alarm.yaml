task_id: hcsr501_motion_alarm
name: Sound active buzzer when HC-SR501 detects motion
platform: esp32s3_espidf
level: level2
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '11'
  components:
  - type: pir_surrogate
    id: pir1
    pin: '14'
  - type: active_buzzer
    id: buzzer1
    pin: '11'
scenario:
  family: pir_state_sequence
  part_id: pir1
  initial_delay_ms: 200
  states:
  - value: 0
    duration_ms: 250
  - value: 1
    duration_ms: 350
  - value: 0
    duration_ms: 250
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
      required_patterns:
      - gpio_get_level\s*\(
      - gpio_set_level\s*\(
  - family: stimulus_to_output
    params:
      channel: D0
      active_windows_s:
      - - 0.52
        - 0.75
      inactive_windows_s:
      - - 0.25
        - 0.4
      - - 0.9
        - 1.0
simulation:
  timeout_ms: 1200
case:
  id: hcsr501-motion-alarm-wokwi-esp32s3-espidf
  sketch_name: hcsr501_motion_alarm
board:
  type: board-esp32-s3-devkitc-1
