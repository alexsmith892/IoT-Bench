  - type: matrix_key
    id: kD
    pins:
      row: '14'
      col: '40'
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
  - part_id: k1
    control: pressed
    value: 1
    duration_ms: 120
  - part_id: k1
    control: pressed
    value: 0
    duration_ms: 80
  - part_id: k2
    control: pressed
    value: 1
    duration_ms: 120
  - part_id: k2
    control: pressed
    value: 0
    duration_ms: 80
  - part_id: k3
    control: pressed
    value: 1
    duration_ms: 120
  - part_id: k3
    control: pressed
    value: 0
    duration_ms: 80
  - part_id: k4
    control: pressed
    value: 1
    duration_ms: 120
  - part_id: k4
    control: pressed
    value: 0
    duration_ms: 80
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - gpio_set_level\s*\(
      - gpio_get_level\s*\(
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: serial_observation_sequence
    params:
      observations:
      - label: key1
        patterns:
        - Key
        numeric_ranges:
        - - 1
          - 1
      - label: key2
        patterns:
        - Key
        numeric_ranges:
        - - 2
          - 2
      - label: key3
        patterns:
        - Key
        numeric_ranges:
        - - 3
          - 3
      - label: key4
        patterns:
        - Key
        numeric_ranges:
        - - 4
          - 4
simulation:
  timeout_ms: 1500
case:
  id: 16key-keypad-wokwi-esp32s3-espidf
  sketch_name: 16key_keypad
board:
  type: board-esp32-s3-devkitc-1
