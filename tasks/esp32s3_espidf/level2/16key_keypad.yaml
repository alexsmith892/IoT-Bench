task_id: 16key_keypad
name: Scan 16 key keypad and print detected key
platform: esp32s3_espidf
level: level2
fixture:
  family: composite
  components:
  - type: matrix_key
    id: k1
    pins:
      row: '38'
      col: '10'
  - type: matrix_key
    id: k2
    pins:
      row: '38'
      col: '9'
  - type: matrix_key
    id: k3
    pins:
      row: '38'
      col: '41'
  - type: matrix_key
    id: kA
    pins:
      row: '38'
      col: '40'
  - type: matrix_key
    id: k4
    pins:
      row: '39'
      col: '10'
  - type: matrix_key
    id: k5
    pins:
      row: '39'
      col: '9'
  - type: matrix_key
    id: k6
    pins:
      row: '39'
      col: '41'
  - type: matrix_key
    id: kB
    pins:
      row: '39'
      col: '40'
  - type: matrix_key
    id: k7
    pins:
      row: '21'
      col: '10'
  - type: matrix_key
    id: k8
    pins:
      row: '21'
      col: '9'
  - type: matrix_key
    id: k9
    pins:
      row: '21'
      col: '41'
  - type: matrix_key
    id: kC
    pins:
      row: '21'
      col: '40'
  - type: matrix_key
    id: kStar
    pins:
      row: '14'
      col: '10'
  - type: matrix_key
    id: k0
    pins:
      row: '14'
      col: '9'
  - type: matrix_key
