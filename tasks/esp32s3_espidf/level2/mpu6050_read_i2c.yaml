task_id: mpu6050_read_i2c
name: Read MPU6050 raw accelerometer and gyroscope values over I2C
platform: esp32s3_espidf
level: level2
fixture:
  family: composite
  components:
  - type: mpu6050
    id: imu1
    pins:
      sda: '38'
      scl: '39'
simulation_variants:
- id: half_g
  scenario:
    family: control_sequence
    initial_delay_ms: 200
    controls:
    - part_id: imu1
      control: accelX
      value: 0.0
      duration_ms: 50
    - part_id: imu1
      control: accelZ
      value: 1.0
      duration_ms: 300
    - part_id: imu1
      control: accelX
      value: 0.5
      duration_ms: 50
    - part_id: imu1
      control: rotationX
      value: 30
      duration_ms: 500
  validator:
    checks:
    - {}
    - params:
        observations:
        - label: resting_baseline
          patterns:
          - Accel.*Gyro
          numeric_ranges:
          - - -800
            - 800
          - - 15500
            - 17300
        - label: injected_half_g
          patterns:
          - Accel.*Gyro
          numeric_ranges:
          - - 7300
            - 9100
          - - 3300
            - 4700
- id: one_and_half_g
  scenario:
    family: control_sequence
    initial_delay_ms: 200
    controls:
    - part_id: imu1
      control: accelX
      value: 0.0
      duration_ms: 50
    - part_id: imu1
      control: accelZ
      value: 1.0
      duration_ms: 300
    - part_id: imu1
      control: accelX
      value: 1.5
      duration_ms: 50
    - part_id: imu1
      control: rotationX
      value: 60
      duration_ms: 500
  validator:
    checks:
    - {}
    - params:
        observations:
        - label: resting_baseline
          patterns:
          - Accel.*Gyro
          numeric_ranges:
          - - -800
            - 800
          - - 15500
            - 17300
        - label: injected_one_and_half_g
          patterns:
          - Accel.*Gyro
          numeric_ranges:
          - - 23300
            - 25900
          - - 7000
            - 8700
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      required_patterns:
      - i2c_
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
  - family: serial_observation_sequence
    params:
      observations:
      - label: resting_baseline
        patterns:
        - Accel.*Gyro
        numeric_ranges:
        - - -800
          - 800
        - - 15500
          - 17300
      - label: injected_half_g
        patterns:
        - Accel.*Gyro
        numeric_ranges:
        - - 7300
          - 9100
        - - 3300
          - 4700
simulation:
  timeout_ms: 1600
  require_distinct_variant_outputs: true
case:
  id: mpu6050-read-i2c-wokwi-esp32s3-espidf
  sketch_name: mpu6050_read_i2c
board:
  type: board-esp32-s3-devkitc-1
