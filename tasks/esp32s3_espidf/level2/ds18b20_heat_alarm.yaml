task_id: ds18b20_heat_alarm
name: Flash LED and sound buzzer when DS18B20 temperature exceeds 30 C
platform: esp32s3_espidf
level: level2
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '10'
    - signal: D1
      pin: '11'
  components:
  - type: ds18b20
    id: temp1
    pins:
      data: '14'
  - type: active_buzzer
    id: buzzer1
    pin: '10'
  - type: led
    id: led1
    pin: '11'
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
  - part_id: temp1
    control: temperature
    value: 22
    duration_ms: 450
  - part_id: temp1
    control: temperature
    value: 35
    duration_ms: 650
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
      required_patterns:
      - gpio_get_level\s*\(
      - gpio_set_direction\s*\(
  - family: window_ratios
    params:
      channel: D0
      windows:
      - start_s: 0.3
        end_s: 0.55
        ratio_range:
        - 0.0
        - 0.2
      - start_s: 0.85
        end_s: 1.15
        ratio_range:
        - 0.5
        - 1.0
  - family: window_ratios
    params:
      channel: D1
      windows:
      - start_s: 0.3
        end_s: 0.55
        ratio_range:
        - 0.0
        - 0.2
      - start_s: 0.85
        end_s: 1.15
        ratio_range:
        - 0.2
        - 0.8
simulation:
  timeout_ms: 1500
case:
  id: ds18b20-heat-alarm-wokwi-esp32s3-espidf
  sketch_name: ds18b20_heat_alarm
board:
  type: board-esp32-s3-devkitc-1
