task_id: tilt_detection_alarm
name: Sound buzzer when tilt switch changes state
platform: esp32s3_espidf
level: level2
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '13'
  components:
  - type: tilt_switch
    id: tilt1
    pin: '14'
  - type: active_buzzer
    id: buzzer1
    pin: '13'
scenario:
  family: timeline
  steps:
  - delay_ms: 200
  - set_control:
      part_id: tilt1
      control: pressed
      value: 1
  - delay_ms: 500
  - set_control:
      part_id: tilt1
      control: pressed
      value: 0
  - delay_ms: 300
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
      required_patterns:
      - gpio_get_level\s*\(
      - gpio_set_level\s*\(
  - family: stimulus_to_output
    params:
      channel: D0
      active_windows_s:
      - - 0.3
        - 0.6
      inactive_windows_s:
      - - 0.8
        - 0.95
simulation:
  timeout_ms: 1200
case:
  id: tilt-detection-alarm-wokwi-esp32s3-espidf
  sketch_name: tilt_detection_alarm
board:
  type: board-esp32-s3-devkitc-1
