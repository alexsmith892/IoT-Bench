task_id: bme280_read_spi
name: Read BME280 humidity, temperature, and pressure over SPI
platform: esp32s3_espidf
level: level2
support:
  status: supported
custom_chips:
- name: bme280
  binary: chips/bme280.chip.wasm
fixture:
  family: composite
  analyzer:
    channels:
    - signal: D0
      pin: '38'
    - signal: D1
      pin: '40'
    - signal: D2
      pin: '39'
    - signal: D3
      pin: '41'
  components:
  - type: bme280_spi
    id: bme1
    pins:
      sck: '38'
      miso: '40'
      mosi: '39'
      cs: '41'
    attrs:
      temperatureC: '24.5'
      humidityRH: '55.0'
      pressurePa: '101325'
simulation_variants:
- id: scenario_a
  attrs:
    bme1:
      temperatureC: '24.5'
      humidityRH: '55.0'
      pressurePa: '101325'
  validator:
    checks:
    - {}
    - params:
        expected_temperature_c: 24.5
        expected_humidity_rh: 55.0
        expected_pressure_pa: 101325
- id: scenario_b
  attrs:
    bme1:
      temperatureC: '31.0'
      humidityRH: '42.0'
      pressurePa: '99000'
  validator:
    checks:
    - {}
    - params:
        expected_temperature_c: 31.0
        expected_humidity_rh: 42.0
        expected_pressure_pa: 99000
validator:
  family: composite
  checks:
  - family: static_checks
    params:
      forbidden_calls:
      - pinMode
      - digitalRead
      - digitalWrite
      - analogRead
      - delay
      - delayMicroseconds
      - tone
      - noTone
      - pulseIn
      - Serial.begin
      - Serial.print
      - Serial.println
      - Wire.begin
      - Wire.requestFrom
      - Wire.read
      - SPI.begin
      - LiquidCrystal
      - Keypad
      required_patterns:
      - spi_
  - family: bme280_environment
    params:
      expected_temperature_c: 24.5
      expected_humidity_rh: 55.0
      expected_pressure_pa: 101325
      temperature_tolerance_c: 0.5
      humidity_tolerance_rh: 2.0
      pressure_tolerance_pa: 100
      bus_activity:
        bus: spi
        pins:
        - D0
        - D1
        - D2
        - D3
        min_transitions: 2
simulation:
  timeout_ms: 3000
  require_distinct_variant_outputs: true
case:
  id: bme280-read-spi-wokwi-esp32s3-espidf
  sketch_name: bme280_read_spi
board:
  type: board-esp32-s3-devkitc-1
