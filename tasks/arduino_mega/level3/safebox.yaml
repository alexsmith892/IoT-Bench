task_id: safebox
name: Unlock relay when keypad password 1234 is entered
platform: arduino_mega
level: level3
support:
  status: manual
  reason: Wokwi keypad password entry is UI-driven and not reliably automated by CLI scenarios
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "13"}
  components:
    - type: keypad4x4
      id: keypad1
      pins: {r1: "9", r2: "8", r3: "7", r4: "6", c1: "5", c2: "4", c3: "3", c4: "2"}
    - type: relay
      id: relay1
      pin: "13"
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["1234", "digitalWrite\\s*\\(\\s*13"]
    - family: window_ratios
      params:
        channel: D0
        windows: [{start_s: 0.20, end_s: 0.80, ratio_range: [0.80, 1.0]}]
simulation: {timeout_ms: 1000}
case: {id: safebox-wokwi-mega, sketch_name: safebox}
