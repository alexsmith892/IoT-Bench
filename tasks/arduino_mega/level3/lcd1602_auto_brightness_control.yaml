task_id: lcd1602_auto_brightness_control
name: Map photoresistor reading to LCD1602 backlight PWM
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "10"}
  components:
    - type: photoresistor
      id: photo1
      pin: A2
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7", a: "10"}
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: photo1, control: lux, value: 1000, duration_ms: 350}
    - {part_id: photo1, control: lux, value: 0.1, duration_ms: 350}
validator:
  family: window_ratios
  params:
    channel: D0
    windows:
      - {start_s: 0.30, end_s: 0.50, ratio_range: [0.02, 0.25]}
      - {start_s: 0.70, end_s: 0.90, ratio_range: [0.70, 1.00]}
simulation: {timeout_ms: 1200}
case: {id: lcd1602-auto-brightness-control-wokwi-mega, sketch_name: lcd1602_auto_brightness_control}
