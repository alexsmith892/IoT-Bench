task_id: tmp36_read_periodic_display
name: Log TMP36 reading to LCD every second and reset on button
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: tmp36_surrogate
      id: pot1
      pin: A0
      initial_value: 153
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
# The pot surrogate changes mid-run, so successive 1 s log lines must show the
# counter advancing AND the raw ADC reading tracking the analog input. Each
# variant uses a different seed and a different mid-run level.
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
    - {value: 0.15, duration_ms: 1100}
    - {value: 0.50, duration_ms: 1200}
simulation_variants:
  - id: low_to_mid
    attrs: {pot1: {value: "153"}}
  - id: high_to_low
    attrs: {pot1: {value: "716"}}
    scenario:
      family: analog_position_sequence
      part_id: pot1
      initial_delay_ms: 200
      positions:
        - {value: 0.70, duration_ms: 1100}
        - {value: 0.30, duration_ms: 1200}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Temp #1:"]
                expected_regexps: ["\\b71[4-8](\\.\\d)?\\s*F"]
              - expected_texts: ["Temp #2:"]
              - expected_regexps: ["Temp #[23]:", "\\b30[4-9](\\.\\d)?\\s*F"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["millis\\s*\\(|delay\\s*\\(\\s*1000", "analogRead\\s*\\(\\s*A0"]
        required_any_patterns: [["attachInterrupt", "digitalPinToInterrupt"]]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Temp #1:"]
            expected_regexps: ["\\b15[2-4](\\.\\d)?\\s*F"]
          - expected_texts: ["Temp #2:"]
          - expected_regexps: ["Temp #[23]:", "\\b51[0-3](\\.\\d)?\\s*F"]
simulation: {timeout_ms: 3100}
case: {id: tmp36-read-periodic-display-wokwi-mega, sketch_name: tmp36_read_periodic_display}
