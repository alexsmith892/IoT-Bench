task_id: tmp36_read_periodic_display
name: Log TMP36 reading to LCD every second and reset on button
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: tmp36_surrogate
      id: pot1
      pin: A0
      initial_value: 153
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["millis\\s*\\(|delay\\s*\\(\\s*1000", "analogRead\\s*\\(\\s*A0"]
        required_any_patterns: [["attachInterrupt", "digitalPinToInterrupt"]]
    - family: lcd_text
      params:
        expected_texts: ["Temp #"]
simulation: {timeout_ms: 2600}
case: {id: tmp36-read-periodic-display-wokwi-mega, sketch_name: tmp36_read_periodic_display}
