task_id: mpu6050_read_button_display
name: Read MPU6050 on button interrupt and display accel/gyro on LCD
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: mpu6050
      id: imu1
      pins: {sda: "20", scl: "21"}
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
# Each variant establishes a resting baseline, presses the button (LCD shows
# resting values), injects variant-specific accel/gyro, and presses again: the
# displayed raw counts must track the injection (defaults: 16384 LSB/g, 131
# LSB/dps), so a hardcoded display fails.
scenario:
  family: timeline
  steps:
    - {delay_ms: 200}
    - set_control: {part_id: imu1, control: accelX, value: 0.0}
    - set_control: {part_id: imu1, control: accelZ, value: 1.0}
    - {delay_ms: 300}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 600}
    - set_control: {part_id: imu1, control: accelX, value: 0.5}
    - set_control: {part_id: imu1, control: rotationX, value: 30}
    - {delay_ms: 200}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 600}
simulation_variants:
  - id: half_g
  - id: one_and_half_g
    scenario:
      family: timeline
      steps:
        - {delay_ms: 200}
        - set_control: {part_id: imu1, control: accelX, value: 0.0}
        - set_control: {part_id: imu1, control: accelZ, value: 1.0}
        - {delay_ms: 300}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
        - set_control: {part_id: imu1, control: accelX, value: 1.5}
        - set_control: {part_id: imu1, control: rotationX, value: 60}
        - {delay_ms: 200}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Accel:", "Gyro:"]
                expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
              - expected_texts: ["Accel:", "Gyro:"]
                # ax ~ 1.5 g = 24576 counts, gx ~ 60 dps = 7860 counts
                expected_regexps: ["Accel:\\s*2[45][0-9]{3}", "Gyro:\\s*(7[5-9][0-9]{2}|8[01][0-9]{2})"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["Wire\\.begin\\s*\\(", "Wire\\.requestFrom", "Wire\\.read\\s*\\("]
        required_any_patterns: [["attachInterrupt", "digitalPinToInterrupt"]]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Accel:", "Gyro:"]
            expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
          - expected_texts: ["Accel:", "Gyro:"]
            # ax ~ 0.5 g = 8192 counts, gx ~ 30 dps = 3930 counts
            expected_regexps: ["Accel:\\s*8[0-3][0-9]{2}", "Gyro:\\s*(3[89][0-9]{2}|40[0-9]{2})"]
simulation: {timeout_ms: 2700}
case: {id: mpu6050-read-button-display-wokwi-mega, sketch_name: mpu6050_read_button_display}
