task_id: reaction_timer_display
name: Start timer by button, stop by shock sensor, display milliseconds
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: shock_sensor
      id: shock1
      pin: "3"
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
# The displayed milliseconds must match the scenario's button->shock gap, with
# a different gap per variant, so showing any fixed "... ms" string fails.
scenario:
  family: timeline
  steps:
    - {delay_ms: 200}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 250}
    - set_control: {part_id: shock1, control: pressed, value: 1}
    - {delay_ms: 150}
simulation_variants:
  - id: quick_reaction
  - id: slow_reaction
    scenario:
      family: timeline
      steps:
        - {delay_ms: 200}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
        - set_control: {part_id: shock1, control: pressed, value: 1}
        - {delay_ms: 150}
    validator:
      checks:
        - {}
        - params:
            # ~700 ms gap; accept 640-849 ms.
            expected_regexps: ["\\b(6[4-9][0-9]|7[0-9]{2}|8[0-4][0-9])\\s*ms"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["digitalRead\\s*\\(", "millis\\s*\\("]
    - family: lcd_text
      params:
        expected_texts: ["ms"]
        # ~350 ms gap; accept 300-449 ms.
        expected_regexps: ["\\b(3[0-9]{2}|4[0-4][0-9])\\s*ms"]
simulation: {timeout_ms: 1500}
case: {id: reaction-timer-display-wokwi-mega, sketch_name: reaction_timer_display}
