task_id: safebox_display
name: Unlock relay and display password/status on LCD
platform: arduino_mega
level: level3
# Live-supported via matrix_key surrogates. Keypad sits on pins 22..28 / 30..36 to
# stay clear of the LCD data pins (4..7). The scenario enters a wrong code then the
# correct 1234; the LCD oracle checks the final "Input: 1234" / "Status: Success"
# frame and the two relay windows enforce the lock/unlock behaviour.
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "13"}
      - {signal: D1, pin: "12"}
      - {signal: D2, pin: "11"}
      - {signal: D3, pin: "4"}
      - {signal: D4, pin: "5"}
      - {signal: D5, pin: "6"}
      - {signal: D6, pin: "7"}
  components:
    # Keys 1,2,3,4,5 on rows 22,24 / columns 30,32,34 (standard 4x4 layout).
    - {type: matrix_key, id: k1, pins: {row: "22", col: "30"}}
    - {type: matrix_key, id: k2, pins: {row: "22", col: "32"}}
    - {type: matrix_key, id: k3, pins: {row: "22", col: "34"}}
    - {type: matrix_key, id: k4, pins: {row: "24", col: "30"}}
    - {type: matrix_key, id: k5, pins: {row: "24", col: "32"}}
    - type: relay
      id: relay1
      pin: "13"
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    # Wrong code 1-2-3-5 (relay LOW, LCD shows Denied).
    - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k5, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k5, control: pressed, value: 0, duration_ms: 80}
    # Correct code 1-2-3-4 (relay unlocks, LCD shows Success).
    - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k4, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k4, control: pressed, value: 0, duration_ms: 80}
# Variants differ in the wrong code typed first; the LCD must echo the actual
# keys pressed (variant-specific wrong code) before the final Success frame, so
# a display hardcoding "Input: 1234 / Status: Success" fails.
simulation_variants:
  - id: wrong_1235
  - id: wrong_1325
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        # Wrong code 1-3-2-5 (relay LOW), then the correct 1-2-3-4.
        - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k5, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k5, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k4, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k4, control: pressed, value: 0, duration_ms: 80}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Input: 1325"]
              - expected_texts: ["Input: 1234", "Status: Success"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["digitalRead", "digitalWrite"]
    - family: lcd_text_sequence
      params:
        signals: {rs: D1, e: D2, d4: D3, d5: D4, d6: D5, d7: D6}
        frames:
          - expected_texts: ["Input: 1235"]
          - expected_texts: ["Input: 1234", "Status: Success"]
    - family: window_ratios
      params:
        channel: D0
        windows:
          - {start_s: 0.30, end_s: 1.45, ratio_range: [0.0, 0.15]}
          - {start_s: 1.95, end_s: 2.45, ratio_range: [0.85, 1.0]}
simulation: {timeout_ms: 2600}
case: {id: safebox-display-wokwi-mega, sketch_name: safebox_display}
