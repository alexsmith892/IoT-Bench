task_id: mpu6050_read_periodic_display
name: Read MPU6050 every 100 ms, average 10 samples, display on LCD
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: mpu6050
      id: imu1
      pins: {sda: "20", scl: "21"}
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
# Each variant injects variant-specific accel/gyro mid-run; the periodically
# refreshed display must first show the resting baseline and then track the
# injected raw counts (defaults: 16384 LSB/g, 131 LSB/dps). The injected level
# is held long enough for a 10-sample (1 s) moving average to settle.
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
    - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 650}
    - {part_id: imu1, control: accelX, value: 0.5, duration_ms: 50}
    - {part_id: imu1, control: rotationX, value: 30, duration_ms: 1500}
simulation_variants:
  - id: half_g
  - id: one_and_half_g
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
        - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 650}
        - {part_id: imu1, control: accelX, value: 1.5, duration_ms: 50}
        - {part_id: imu1, control: rotationX, value: 60, duration_ms: 1500}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Accel:", "Gyro:"]
                expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
              - expected_texts: ["Accel:", "Gyro:"]
                # ax ~ 1.5 g = 24576 counts, gx ~ 60 dps = 7860 counts
                expected_regexps: ["Accel:\\s*2[45][0-9]{3}", "Gyro:\\s*(7[5-9][0-9]{2}|8[01][0-9]{2})"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["Wire\\.begin\\s*\\(", "millis\\s*\\(", "Wire\\.requestFrom", "Wire\\.read\\s*\\("]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Accel:", "Gyro:"]
            expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
          - expected_texts: ["Accel:", "Gyro:"]
            # ax ~ 0.5 g = 8192 counts, gx ~ 30 dps = 3930 counts
            expected_regexps: ["Accel:\\s*8[0-3][0-9]{2}", "Gyro:\\s*(3[89][0-9]{2}|40[0-9]{2})"]
simulation: {timeout_ms: 2900}
case: {id: mpu6050-read-periodic-display-wokwi-mega, sketch_name: mpu6050_read_periodic_display}
