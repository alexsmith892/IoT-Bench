task_id: tmp36_read_button_display
name: Sample TMP36 on button interrupt and display Fahrenheit on LCD
platform: arduino_mega
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "12"}
      - {signal: D1, pin: "11"}
      - {signal: D2, pin: "4"}
      - {signal: D3, pin: "5"}
      - {signal: D4, pin: "6"}
      - {signal: D5, pin: "7"}
  components:
    - type: button
      id: btn1
      pin: "2"
    - type: tmp36_surrogate
      id: pot1
      pin: A0
      initial_value: 153
    - type: lcd1602
      id: lcd1
      pins: {rs: "12", e: "11", d4: "4", d5: "5", d6: "6", d7: "7"}
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 200
  presses:
    - {duration_ms: 150, after_ms: 800}
# Each variant seeds a different TMP36 output (ADC counts via the pot surrogate)
# and requires the displayed Fahrenheit value to match it, so a hardcoded
# display fails the other variant. 153 counts ~ 24.8 C ~ 77 F; 184 ~ 104 F.
simulation_variants:
  - id: warm
    attrs: {pot1: {value: "153"}}
  - id: hot
    attrs: {pot1: {value: "184"}}
    validator:
      checks:
        - {}
        - params:
            expected_regexps: ["Temp:\\s*10[3-5](\\.\\d)?\\s*F"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["analogRead\\s*\\(\\s*A0"]
        required_any_patterns: [["attachInterrupt", "digitalPinToInterrupt"]]
    - family: lcd_text
      params:
        expected_texts: ["Temp:"]
        expected_regexps: ["Temp:\\s*7[6-8](\\.\\d)?\\s*F"]
simulation: {timeout_ms: 1800}
case: {id: tmp36-read-button-display-wokwi-mega, sketch_name: tmp36_read_button_display}
