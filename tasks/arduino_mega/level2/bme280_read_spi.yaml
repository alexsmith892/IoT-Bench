task_id: bme280_read_spi
name: Read BME280 humidity and temperature over SPI
platform: arduino_mega
level: level2
support:
  status: supported
custom_chips:
  - name: bme280
    binary: chips/bme280.chip.wasm
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "35"}
      - {signal: D1, pin: "37"}
      - {signal: D2, pin: "36"}
      - {signal: D3, pin: "21"}
  components:
    - type: bme280_spi
      id: bme1
      pins: {sck: "35", miso: "37", mosi: "36", cs: "21"}
      attrs: {temperatureC: "24.5", humidityRH: "55.0", pressurePa: "101325"}
simulation_variants:
  - id: scenario_a
    attrs: {bme1: {temperatureC: "24.5", humidityRH: "55.0"}}
    validator:
      params: {expected_temperature_c: 24.5, expected_humidity_rh: 55.0}
  - id: scenario_b
    attrs: {bme1: {temperatureC: "31.0", humidityRH: "42.0"}}
    validator:
      params: {expected_temperature_c: 31.0, expected_humidity_rh: 42.0}
validator:
  family: bme280_environment
  params:
    expected_temperature_c: 24.5
    expected_humidity_rh: 55.0
    temperature_tolerance_c: 0.5
    humidity_tolerance_rh: 2.0
    bus_activity: {bus: spi, pins: [D0, D1, D2, D3], min_transitions: 2}
simulation: {timeout_ms: 3000, require_distinct_variant_outputs: true}
case: {id: bme280-read-spi-wokwi-mega, sketch_name: bme280_read_spi}
