task_id: photoresistor_nightlight
name: Turn on LED when photoresistor light level falls below threshold
platform: arduino_mega
level: level2
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "3"}
  components:
    - type: photoresistor
      id: photo1
      pin: A2
    - type: led
      id: led1
      pin: "3"
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: photo1, control: lux, value: 1000, duration_ms: 400}
    - {part_id: photo1, control: lux, value: 0.1, duration_ms: 400}
validator:
  family: stimulus_to_output
  params:
    channel: D0
    active_windows_s: [[0.30, 0.55]]
    inactive_windows_s: [[0.75, 0.95]]
simulation: {timeout_ms: 1200}
case: {id: photoresistor-nightlight-wokwi-mega, sketch_name: photoresistor_nightlight}
