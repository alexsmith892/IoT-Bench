task_id: 16key_keypad
name: Scan 16 key keypad and print detected key
platform: arduino_mega
level: level2
# Live-supported via a faithful surrogate: the native wokwi-membrane-keypad has no
# automation control (wokwi-cli issue #10), so the 16 keys are modelled as
# matrix_key cross-point switches bridging the same row/column nets. Under a
# standard column-drive / row-read scan these are electrically indistinguishable
# from real keypad keys (including ghosting), so firmware behaves identically.
# A control_sequence presses a known key order and serial_observation_sequence
# checks the exact decoded keys in order.
fixture:
  family: composite
  components:
    # Row pins 9,8,7,6 ; column pins 5,4,3,2 (standard 4x4 layout).
    - {type: matrix_key, id: k1, pins: {row: "9", col: "5"}}
    - {type: matrix_key, id: k2, pins: {row: "9", col: "4"}}
    - {type: matrix_key, id: k3, pins: {row: "9", col: "3"}}
    - {type: matrix_key, id: kA, pins: {row: "9", col: "2"}}
    - {type: matrix_key, id: k4, pins: {row: "8", col: "5"}}
    - {type: matrix_key, id: k5, pins: {row: "8", col: "4"}}
    - {type: matrix_key, id: k6, pins: {row: "8", col: "3"}}
    - {type: matrix_key, id: kB, pins: {row: "8", col: "2"}}
    - {type: matrix_key, id: k7, pins: {row: "7", col: "5"}}
    - {type: matrix_key, id: k8, pins: {row: "7", col: "4"}}
    - {type: matrix_key, id: k9, pins: {row: "7", col: "3"}}
    - {type: matrix_key, id: kC, pins: {row: "7", col: "2"}}
    - {type: matrix_key, id: kStar, pins: {row: "6", col: "5"}}
    - {type: matrix_key, id: k0, pins: {row: "6", col: "4"}}
    - {type: matrix_key, id: kHash, pins: {row: "6", col: "3"}}
    - {type: matrix_key, id: kD, pins: {row: "6", col: "2"}}
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k4, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k4, control: pressed, value: 0, duration_ms: 80}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["pinMode", "digitalRead", "digitalWrite"]
    - family: serial_observation_sequence
      params:
        observations:
          - {label: key1, patterns: ["Key"], numeric_ranges: [[1, 1]]}
          - {label: key2, patterns: ["Key"], numeric_ranges: [[2, 2]]}
          - {label: key3, patterns: ["Key"], numeric_ranges: [[3, 3]]}
          - {label: key4, patterns: ["Key"], numeric_ranges: [[4, 4]]}
simulation: {timeout_ms: 1500}
case: {id: 16key-keypad-wokwi-mega, sketch_name: 16key_keypad}
