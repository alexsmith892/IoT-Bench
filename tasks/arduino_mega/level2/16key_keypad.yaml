task_id: 16key_keypad
name: Scan 16 key keypad and print detected key
platform: arduino_mega
level: level2
support:
  status: manual
  reason: Wokwi keypad interactions are keyboard-driven and not reliably automated by CLI scenarios
fixture:
  family: composite
  components:
    - type: keypad4x4
      id: keypad1
      pins: {r1: "9", r2: "8", r3: "7", r4: "6", c1: "5", c2: "4", c3: "3", c4: "2"}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["pinMode", "digital(Read|Write)"]
    - family: serial_regex_sequence
      params:
        patterns: ["Key.*1", "Key.*2", "Key.*3", "Key.*4"]
simulation: {timeout_ms: 1000}
case: {id: 16key-keypad-wokwi-mega, sketch_name: 16key_keypad}
