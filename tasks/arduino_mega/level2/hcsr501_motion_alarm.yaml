task_id: hcsr501_motion_alarm
name: Sound active buzzer when HC-SR501 detects motion
platform: arduino_mega
level: level2
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "3"}
  components:
    - type: pir_surrogate
      id: pir1
      pin: "18"
    - type: active_buzzer
      id: buzzer1
      pin: "3"
scenario:
  family: pir_state_sequence
  part_id: pir1
  initial_delay_ms: 200
  states:
    - {value: 0, duration_ms: 250}
    - {value: 1, duration_ms: 350}
    - {value: 0, duration_ms: 250}
validator:
  family: stimulus_to_output
  params:
    channel: D0
    active_windows_s: [[0.52, 0.75]]
    inactive_windows_s: [[0.25, 0.40], [0.90, 1.00]]
simulation: {timeout_ms: 1200}
case: {id: hcsr501-motion-alarm-wokwi-mega, sketch_name: hcsr501_motion_alarm}
