task_id: buzzer_doorbell
name: Turn on a buzzer while a button is pressed
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: button_to_buzzer
  pins:
    button: "2"
    buzzer: "13"
  analyzer:
    channels:
      - signal: D0
        pin: "13"
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 200
  presses:
    - duration_ms: 300
      after_ms: 300
    - duration_ms: 300
      after_ms: 300
validator:
  family: stimulus_to_output
  params:
    channel: D0
    active_windows_s: [[0.25, 0.45], [0.85, 1.05]]
    inactive_windows_s: [[0.05, 0.15], [0.55, 0.75], [1.15, 1.35]]
    active_ratio_min: 0.8
    inactive_ratio_max: 0.2
simulation:
  timeout_ms: 1600
case:
  id: buzzer-doorbell-wokwi-mega
  sketch_name: buzzer_doorbell

