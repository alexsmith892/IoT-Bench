task_id: blink_led_no_delay
name: Blink an LED at 1 Hz without blocking delay calls
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: single_led_output
  pins:
    led: "3"
  analyzer:
    channels:
      - signal: D0
        pin: "3"
static_checks:
  # This is an intentionally conservative syntactic screen, not proof that the
  # firmware is semantically non-blocking.
  forbidden_calls: [delay, delayMicroseconds]
validator:
  family: no_delay_static_plus_waveform
  params:
    channels:
      D0:
        frequency_hz: 1.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.475, 0.525]
        full_period_range_s: [0.95, 1.05]
        duty_cycle_range: [0.45, 0.55]
simulation:
  timeout_ms: 6000
case:
  id: blink-led-no-delay-wokwi-mega
  sketch_name: blink_led_no_delay

