task_id: sensor_pir_human_motion
name: Report PIR human motion and no-motion states
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: pir_serial
  pins:
    pir: "4"
scenario:
  # Wokwi's PIR part documents manual triggering but not automation controls.
  # The fixture uses a controllable active-high digital input with part id pir1.
  family: pir_state_sequence
  part_id: pir1
  initial_delay_ms: 200
  states:
    - value: 0
      duration_ms: 250
    - value: 1
      duration_ms: 350
    - value: 0
      duration_ms: 350
# Each variant drives a different motion pattern; the validator derives the
# expected text sequence from the variant's states, so output printed from
# setup() (or any fixed pattern) fails the other variant.
simulation_variants:
  - id: single_motion
  - id: double_motion
    scenario:
      family: pir_state_sequence
      part_id: pir1
      initial_delay_ms: 200
      states:
        - {value: 0, duration_ms: 250}
        - {value: 1, duration_ms: 350}
        - {value: 0, duration_ms: 300}
        - {value: 1, duration_ms: 350}
        - {value: 0, duration_ms: 300}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        # The PIR state must actually be sampled from the input pin.
        required_patterns: ["digitalRead\\s*\\("]
    - family: serial_contains_on_stimulus
      params:
        expected_texts: ["Motion Detected!", "No Motion Detected!"]
        state_texts:
          "0": "No Motion Detected!"
          "1": "Motion Detected!"
        min_count: 1
simulation:
  timeout_ms: 2100
  require_distinct_variant_outputs: true
case:
  id: sensor-pir-human-motion-wokwi-mega
  sketch_name: sensor_pir_human_motion
