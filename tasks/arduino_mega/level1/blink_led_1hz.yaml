task_id: blink_led_1hz
name: Blink an LED at 1 Hz on GPIO 3
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: single_led_output
  pins:
    led: "3"
  analyzer:
    channels:
      - signal: D0
        pin: "3"
validator:
  family: waveform_frequency
  params:
    channels:
      D0:
        frequency_hz: 1.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.45, 0.55]
        full_period_range_s: [0.9, 1.1]
        duty_cycle_range: [0.4, 0.6]
simulation:
  timeout_ms: 6000
case:
  id: blink-1hz-wokwi-mega
  sketch_name: blink_1hz_wokwi_mega

