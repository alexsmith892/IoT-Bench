task_id: button_press_debounce
name: Debounce a pull-down button and print one trigger per intended press
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: button_serial
  pins:
    button: "2"
  button_attrs:
    bounce: "0"
scenario:
  # Synthetic rapid transitions emulate bounce. This avoids depending on the
  # exact simulator bounce model, which is useful but not a stable oracle.
  family: bounced_button_sequence
  part_id: btn1
  initial_delay_ms: 200
  final_delay_ms: 250
  sequence:
    - value: 1
      duration_ms: 1
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 2
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 300
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 250
validator:
  family: debounce_serial
  params:
    expected_text: "Button Pressed!"
    expected_triggers: 2
simulation:
  timeout_ms: 1200
case:
  id: button-press-debounce-wokwi-mega
  sketch_name: button_press_debounce

