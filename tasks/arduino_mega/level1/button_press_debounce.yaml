task_id: button_press_debounce
name: Debounce a pull-down button and print one trigger per intended press
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: button_serial
  pins:
    button: "2"
  button_attrs:
    bounce: "0"
scenario:
  # Synthetic rapid transitions emulate bounce. This avoids depending on the
  # exact simulator bounce model, which is useful but not a stable oracle.
  family: bounced_button_sequence
  part_id: btn1
  initial_delay_ms: 200
  final_delay_ms: 250
  sequence:
    - value: 1
      duration_ms: 1
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 2
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 300
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 250
# Each variant injects a different number of intended presses (with bounce
# noise), and the trigger count must match exactly, so printing a fixed number
# of "Button Pressed!" lines fails the other variant.
simulation_variants:
  - id: two_presses
  - id: three_presses
    scenario:
      family: bounced_button_sequence
      part_id: btn1
      initial_delay_ms: 200
      final_delay_ms: 250
      sequence:
        - {value: 1, duration_ms: 1}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 2}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 250}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
    validator:
      checks:
        - {}
        - params:
            expected_triggers: 3
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        # Debouncing requires sampling the pin and timing the bounce window.
        required_patterns: ["digitalRead\\s*\\(", "millis\\s*\\("]
    - family: debounce_serial
      params:
        expected_text: "Button Pressed!"
        expected_triggers: 2
simulation:
  # Longest variant scenario ends at 1546 ms plus observation margin.
  timeout_ms: 2100
  require_distinct_variant_outputs: true
case:
  id: button-press-debounce-wokwi-mega
  sketch_name: button_press_debounce

