task_id: tmp36_read
name: Read TMP36-like analog temperature on A0 and print Celsius
platform: arduino_mega
level: level1
board:
  type: wokwi-arduino-mega
  fqbn: arduino:avr:mega
fixture:
  family: analog_temperature_serial
  pins:
    analog: A0
  analog_source:
    # Wokwi does not provide a TMP36 part; this uses a potentiometer as an
    # analog voltage source. TMP36 mapping: Celsius = (Vout - 0.5) * 100.
    initial_value: 153
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
    - value: 0.10
      duration_ms: 350
    - value: 0.15
      duration_ms: 350
validator:
  family: analog_temperature_serial
  params:
    expected_celsius: [0.0, 25.0]
    tolerance_celsius: 6.0
simulation:
  timeout_ms: 1200
case:
  id: tmp36-read-wokwi-mega
  sketch_name: tmp36_read
