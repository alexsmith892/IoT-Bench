task_id: hcsr501_motion_alarm
name: Sound active buzzer when HC-SR501 detects motion (Zephyr)
platform: zephyr_nano33ble
level: level2
fixture:
  family: composite
  analyzer:
    channels:
      - signal: D0
        pin: "P1.12"
  components:
    - type: pir
      id: pir1
      pin: "P1.15"
    - type: buzzer
      id: buzzer1
      pin: "P1.12"
scenario:
  family: pir_state_sequence
  part_id: pir1
  initial_delay_ms: 200
  states:
    - value: 0
      duration_ms: 250
    - value: 1
      duration_ms: 350
    - value: 0
      duration_ms: 250
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns:
          - gpio_pin_get(?:_dt|_raw)?\s*\(
          - gpio_pin_set(?:_dt|_raw)?\s*\(
    - family: stimulus_to_output
      params:
        channel: D0
        active_windows_s: [[0.52, 0.75]]
        inactive_windows_s: [[0.25, 0.4], [0.9, 1.0]]
simulation:
  timeout_ms: 1200
case:
  id: hcsr501-motion-alarm-renode-nano33
  sketch_name: hcsr501_motion_alarm
