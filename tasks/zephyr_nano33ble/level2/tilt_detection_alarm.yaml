task_id: tilt_detection_alarm
name: Sound buzzer when tilt switch changes state (Zephyr)
platform: zephyr_nano33ble
level: level2
fixture:
  family: composite
  analyzer:
    channels:
      - signal: D0
        pin: "P1.12"
  components:
    - type: button
      id: tilt1
      pin: "P1.15"
    - type: buzzer
      id: buzzer1
      pin: "P1.12"
scenario:
  family: timeline
  steps:
    - delay_ms: 200
    - set_control:
        part_id: tilt1
        control: pressed
        value: 1
    - delay_ms: 500
    - set_control:
        part_id: tilt1
        control: pressed
        value: 0
    - delay_ms: 300
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns:
          - gpio_pin_get(?:_dt|_raw)?\s*\(
          - gpio_pin_set(?:_dt|_raw)?\s*\(
    - family: stimulus_to_output
      params:
        channel: D0
        active_windows_s: [[0.3, 0.6]]
        inactive_windows_s: [[0.8, 0.95]]
simulation:
  timeout_ms: 1200
case:
  id: tilt-detection-alarm-renode-nano33
  sketch_name: tilt_detection_alarm
