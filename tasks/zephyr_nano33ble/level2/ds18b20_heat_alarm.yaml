task_id: ds18b20_heat_alarm
name: Flash LED and sound buzzer when DS18B20 exceeds 30 C (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level2
support:
  status: unsupported
  reason: Renode DS18B20 1-Wire model exists but has not reached live BC with cold/hot scenario changes driving LED/buzzer VCD evidence.
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P0.24"}
  components:
    - type: ds18b20
      id: temp1
      pins: {data: "P1.11"}
      attrs: {temperature: 22}
    - type: active_buzzer
      id: buzzer1
      pin: "P1.12"
    - type: led
      id: led1
      pin: "P0.24"
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: temp1, control: temperature, value: 22, duration_ms: 450}
    - {part_id: temp1, control: temperature, value: 35, duration_ms: 650}
validator:
  family: composite
  checks:
    - family: window_ratios
      params:
        channel: D0
        windows:
          - {start_s: 0.30, end_s: 0.55, ratio_range: [0.00, 0.20]}
          - {start_s: 0.85, end_s: 1.15, ratio_range: [0.50, 1.0]}
    - family: window_ratios
      params:
        channel: D1
        windows:
          - {start_s: 0.30, end_s: 0.55, ratio_range: [0.00, 0.20]}
          - {start_s: 0.85, end_s: 1.15, ratio_range: [0.20, 0.80]}
simulation: {timeout_ms: 1500}
case: {id: ds18b20-heat-alarm-renode-nano33, sketch_name: ds18b20_heat_alarm}
