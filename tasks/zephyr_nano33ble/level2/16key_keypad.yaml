task_id: 16key_keypad
name: Scan 16 key keypad and print detected key (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level2
# The 16 keys are cross-points of the IoT-Bench matrix keypad model
# (bench/chips/keypad/MatrixKeypad.cs), electrically equivalent to the Wokwi
# matrix_key surrogate under a row-drive / column-read scan: while a key is
# held and its row is driven LOW, its column reads LOW; columns idle HIGH.
# Rows P1.11, P1.12, P1.15, P1.13 ; columns P1.14, P0.23, P0.21, P0.27.
fixture:
  family: composite
  components:
    - {type: matrix_key, id: k1, pins: {row: "P1.11", col: "P1.14"}}
    - {type: matrix_key, id: k2, pins: {row: "P1.11", col: "P0.23"}}
    - {type: matrix_key, id: k3, pins: {row: "P1.11", col: "P0.21"}}
    - {type: matrix_key, id: kA, pins: {row: "P1.11", col: "P0.27"}}
    - {type: matrix_key, id: k4, pins: {row: "P1.12", col: "P1.14"}}
    - {type: matrix_key, id: k5, pins: {row: "P1.12", col: "P0.23"}}
    - {type: matrix_key, id: k6, pins: {row: "P1.12", col: "P0.21"}}
    - {type: matrix_key, id: kB, pins: {row: "P1.12", col: "P0.27"}}
    - {type: matrix_key, id: k7, pins: {row: "P1.15", col: "P1.14"}}
    - {type: matrix_key, id: k8, pins: {row: "P1.15", col: "P0.23"}}
    - {type: matrix_key, id: k9, pins: {row: "P1.15", col: "P0.21"}}
    - {type: matrix_key, id: kC, pins: {row: "P1.15", col: "P0.27"}}
    - {type: matrix_key, id: kStar, pins: {row: "P1.13", col: "P1.14"}}
    - {type: matrix_key, id: k0, pins: {row: "P1.13", col: "P0.23"}}
    - {type: matrix_key, id: kHash, pins: {row: "P1.13", col: "P0.21"}}
    - {type: matrix_key, id: kD, pins: {row: "P1.13", col: "P0.27"}}
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: k1, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k1, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k2, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k2, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k3, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k3, control: pressed, value: 0, duration_ms: 80}
    - {part_id: k4, control: pressed, value: 1, duration_ms: 120}
    - {part_id: k4, control: pressed, value: 0, duration_ms: 80}
simulation_variants:
  - id: one_two_three_four
  - id: seven_five_nine_zero
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        - {part_id: k7, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k7, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k5, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k5, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k9, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k9, control: pressed, value: 0, duration_ms: 80}
        - {part_id: k0, control: pressed, value: 1, duration_ms: 120}
        - {part_id: k0, control: pressed, value: 0, duration_ms: 80}
    validator:
      checks:
        - {}
        - params:
            observations:
              - {label: key7, patterns: ["Key"], numeric_ranges: [[7, 7]]}
              - {label: key5, patterns: ["Key"], numeric_ranges: [[5, 5]]}
              - {label: key9, patterns: ["Key"], numeric_ranges: [[9, 9]]}
              - {label: key0, patterns: ["Key"], numeric_ranges: [[0, 0]]}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns:
          ["gpio_pin_configure(?:_dt)?\\s*\\(", "gpio_pin_get(?:_dt|_raw)?\\s*\\(", "gpio_pin_set(?:_dt|_raw)?\\s*\\("]
    - family: serial_observation_sequence
      params:
        observations:
          - {label: key1, patterns: ["Key"], numeric_ranges: [[1, 1]]}
          - {label: key2, patterns: ["Key"], numeric_ranges: [[2, 2]]}
          - {label: key3, patterns: ["Key"], numeric_ranges: [[3, 3]]}
          - {label: key4, patterns: ["Key"], numeric_ranges: [[4, 4]]}
simulation: {timeout_ms: 1500, require_distinct_variant_outputs: true}
case: {id: 16key-keypad-renode-nano33, sketch_name: keypad_16key}
