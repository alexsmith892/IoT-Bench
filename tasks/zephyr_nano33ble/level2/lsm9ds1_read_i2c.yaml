task_id: lsm9ds1_read_i2c
name: Read LSM9DS1 raw accelerometer and gyroscope values over I2C (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level2
fixture:
  family: composite
  components:
    - type: lsm9ds1
      id: imu1
      bus: twi0
      address: "0x6b"
# Each variant injects a different accel/gyro stimulus mid-run (per-variant
# control_sequence) and requires the printed raw counts to track it: first a
# resting baseline line (ax ~ 0 g, az ~ 1 g), then a line reflecting the
# injected values. Raw count expectations follow the Renode LSM9DS1 model,
# verified live: accel 16384 LSB/g, gyro 120 LSB/(deg/s).
simulation_variants:
  - id: half_g
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
        - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 300}
        - {part_id: imu1, control: accelX, value: 0.5, duration_ms: 50}
        - {part_id: imu1, control: rotationX, value: 30, duration_ms: 500}
    validator:
      checks:
        - {}
        - params:
            observations:
              - label: resting_baseline
                patterns: ["Accel.*Gyro"]
                numeric_ranges: [[-800, 800], [15500, 17300]]
              - label: injected_half_g
                patterns: ["Accel.*Gyro"]
                # ax ~ 0.5 g = 8192 counts, gx ~ 30 dps = 3600 counts
                numeric_ranges: [[7300, 9100], [3100, 4100]]
  - id: one_and_half_g
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
        - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 300}
        - {part_id: imu1, control: accelX, value: 1.5, duration_ms: 50}
        - {part_id: imu1, control: rotationX, value: 60, duration_ms: 500}
    validator:
      checks:
        - {}
        - params:
            observations:
              - label: resting_baseline
                patterns: ["Accel.*Gyro"]
                numeric_ranges: [[-800, 800], [15500, 17300]]
              - label: injected_one_and_half_g
                patterns: ["Accel.*Gyro"]
                # ax ~ 1.5 g = 24576 counts, gx ~ 60 dps = 7200 counts
                numeric_ranges: [[23300, 25900], [6700, 7700]]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        # Require the real I2C read path so a hard-coded print stub fails statically.
        required_any_patterns:
          - ["i2c_write_read\\s*\\(", "i2c_read\\s*\\(", "i2c_transfer\\s*\\(", "i2c_burst_read\\s*\\("]
    - family: serial_observation_sequence
      params:
        observations:
          - label: resting_baseline
            patterns: ["Accel.*Gyro"]
            numeric_ranges: [[-800, 800], [15500, 17300]]
          - label: injected_half_g
            patterns: ["Accel.*Gyro"]
            numeric_ranges: [[7300, 9100], [3100, 4100]]
simulation: {timeout_ms: 1600, require_distinct_variant_outputs: true}
case: {id: lsm9ds1-read-i2c-renode-nano33, sketch_name: lsm9ds1_read_i2c}
