task_id: sensor_pir_human_motion
name: Report PIR human motion and no-motion states (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level1
fixture:
  family: pir_serial
  pins:
    pir: "P1.15"
scenario:
  # Deterministic HC-SR501 surrogate: a scenario-driven active-high digital
  # input produces the same GPIO-level signal expected from the sensor output.
  family: pir_state_sequence
  part_id: pir1
  initial_delay_ms: 200
  states:
    - value: 0
      duration_ms: 250
    - value: 1
      duration_ms: 350
    - value: 0
      duration_ms: 350
simulation_variants:
  - id: single_motion
  - id: double_motion
    scenario:
      family: pir_state_sequence
      part_id: pir1
      initial_delay_ms: 200
      states:
        - {value: 0, duration_ms: 250}
        - {value: 1, duration_ms: 350}
        - {value: 0, duration_ms: 300}
        - {value: 1, duration_ms: 350}
        - {value: 0, duration_ms: 300}
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["gpio_pin_get(?:_dt|_raw)?\\s*\\("]
    - family: serial_contains_on_stimulus
      params:
        expected_texts: ["Motion Detected!", "No Motion Detected!"]
        state_texts:
          "0": "No Motion Detected!"
          "1": "Motion Detected!"
        min_count: 1
simulation:
  timeout_ms: 2100
  require_distinct_variant_outputs: true
case:
  id: sensor-pir-human-motion-renode-nano33
  sketch_name: sensor_pir_human_motion
