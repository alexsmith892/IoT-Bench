task_id: button_status_count
name: Count button presses and print the count (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level1
fixture:
  family: button_serial
  pins:
    button: "P1.11"
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 200
  presses:
    - duration_ms: 160
      after_ms: 220
    - duration_ms: 160
      after_ms: 220
    - duration_ms: 160
      after_ms: 220
simulation_variants:
  - id: three_presses
  - id: four_presses
    scenario:
      family: button_press_sequence
      part_id: btn1
      initial_delay_ms: 200
      presses:
        - {duration_ms: 160, after_ms: 220}
        - {duration_ms: 160, after_ms: 220}
        - {duration_ms: 160, after_ms: 220}
        - {duration_ms: 160, after_ms: 220}
    validator:
      params:
        expected_count: 4
static_checks:
  required_patterns: ["gpio_pin_get(?:_dt|_raw)?\\s*\\("]
validator:
  family: serial_count_sequence
  params:
    expected_count: 3
    match_mode: exact_sequence
simulation:
  timeout_ms: 2400
  require_distinct_variant_outputs: true
case:
  id: button-status-count-renode-nano33
  sketch_name: button_status_count
