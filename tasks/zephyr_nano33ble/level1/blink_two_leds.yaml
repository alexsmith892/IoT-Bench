task_id: blink_two_leds
name: Blink two Nano 33 BLE GPIO LEDs at 1 Hz and 2 Hz without blocking sleeps (Zephyr)
platform: zephyr_nano33ble
level: level1
fixture:
  family: dual_led_output
  pins:
    led1: "P0.24"
    led2: "P0.16"
  analyzer:
    channels:
      - signal: D0
        pin: "P0.24"
      - signal: D1
        pin: "P0.16"
static_checks:
  forbidden_calls: [k_msleep, k_sleep, k_usleep, k_busy_wait]
validator:
  family: no_delay_static_plus_waveform
  params:
    channels:
      D0:
        frequency_hz: 1.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.475, 0.525]
        full_period_range_s: [0.95, 1.05]
        duty_cycle_range: [0.45, 0.55]
      D1:
        frequency_hz: 2.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.2375, 0.2625]
        full_period_range_s: [0.475, 0.525]
        duty_cycle_range: [0.45, 0.55]
simulation:
  timeout_ms: 5000
case:
  id: blink-two-leds-renode-nano33
  sketch_name: blink_two_leds
