task_id: blink_led_no_delay
name: Blink the Nano 33 BLE red LED at 1 Hz without blocking sleeps (Zephyr)
platform: zephyr_nano33ble
level: level1
fixture:
  family: single_led_output
  pins:
    led: "P0.24"
  analyzer:
    channels:
      - signal: D0
        pin: "P0.24"
static_checks:
  forbidden_calls: [k_msleep, k_sleep, k_usleep, k_busy_wait]
validator:
  family: no_delay_static_plus_waveform
  params:
    channels:
      D0:
        frequency_hz: 1.0
        min_valid_cycles_after_startup: 4
        half_period_range_s: [0.475, 0.525]
        full_period_range_s: [0.95, 1.05]
        duty_cycle_range: [0.45, 0.55]
simulation:
  timeout_ms: 6000
case:
  id: blink-led-no-delay-renode-nano33
  sketch_name: blink_led_no_delay
