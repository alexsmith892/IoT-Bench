task_id: button_press_debounce
name: Debounce a button and print one trigger per intended press (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level1
fixture:
  family: button_serial
  pins:
    button: "P1.11"
scenario:
  # The bounce waveform is injected by the scenario itself (Renode's Button
  # model is clean), so the oracle is exact in virtual time.
  family: bounced_button_sequence
  part_id: btn1
  initial_delay_ms: 200
  final_delay_ms: 250
  sequence:
    - value: 1
      duration_ms: 1
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 2
    - value: 0
      duration_ms: 1
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 300
    - value: 1
      duration_ms: 80
    - value: 0
      duration_ms: 250
simulation_variants:
  - id: two_presses
  - id: three_presses
    scenario:
      family: bounced_button_sequence
      part_id: btn1
      initial_delay_ms: 200
      final_delay_ms: 250
      sequence:
        - {value: 1, duration_ms: 1}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 2}
        - {value: 0, duration_ms: 1}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 250}
        - {value: 1, duration_ms: 80}
        - {value: 0, duration_ms: 300}
    validator:
      checks:
        - {}
        - params:
            expected_triggers: 3
static_checks:
  required_patterns: ["gpio_pin_get(?:_dt|_raw)?\\s*\\("]
  required_any_patterns:
    - ["k_uptime_get", "k_cycle_get", "k_timer_init"]
validator:
  family: composite
  checks:
    - family: static_checks
    - family: debounce_serial
      params:
        expected_text: "Button Pressed!"
        expected_triggers: 2
simulation:
  timeout_ms: 2100
  require_distinct_variant_outputs: true
case:
  id: button-press-debounce-renode-nano33
  sketch_name: button_press_debounce
