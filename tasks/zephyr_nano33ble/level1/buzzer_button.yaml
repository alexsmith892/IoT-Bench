task_id: buzzer_button
name: Debounced button-controlled buzzer on Nano 33 BLE (Zephyr)
platform: zephyr_nano33ble
level: level1
fixture:
  family: button_to_buzzer
  pins:
    button: "P1.11"
    buzzer: "P1.12"
  analyzer:
    channels:
      - signal: D0
        pin: "P1.12"
scenario:
  family: bounced_button_sequence
  part_id: btn1
  initial_delay_ms: 200
  final_delay_ms: 250
  sequence:
    - {value: 1, duration_ms: 1}
    - {value: 0, duration_ms: 1}
    - {value: 1, duration_ms: 2}
    - {value: 0, duration_ms: 1}
    - {value: 1, duration_ms: 80}
    - {value: 0, duration_ms: 300}
    - {value: 1, duration_ms: 80}
    - {value: 0, duration_ms: 250}
static_checks:
  required_patterns: ["gpio_pin_get(?:_dt|_raw)?\\s*\\("]
  required_any_patterns: [["k_uptime_get", "k_cycle_get", "k_timer_init"]]
validator:
  family: composite
  checks:
    - family: static_checks
    - family: stimulus_to_output
      params:
        channel: D0
        active_windows_s: [[0.245, 0.28], [0.625, 0.66]]
        inactive_windows_s: [[0.05, 0.15], [0.30, 0.55], [0.70, 0.80]]
        active_ratio_min: 0.8
        inactive_ratio_max: 0.2
simulation:
  timeout_ms: 1400
case:
  id: buzzer-button-renode-nano33
  sketch_name: buzzer_button
