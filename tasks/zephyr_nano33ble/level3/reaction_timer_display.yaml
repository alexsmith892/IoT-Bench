task_id: reaction_timer_display
name: Start timer by button, stop by shock sensor, display milliseconds (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P1.14"}
      - {signal: D2, pin: "P1.15"}
      - {signal: D3, pin: "P1.13"}
      - {signal: D4, pin: "P0.21"}
      - {signal: D5, pin: "P0.27"}
  components:
    - type: button
      id: btn1
      pin: "P1.11"
    - type: shock_sensor
      id: shock1
      pin: "P1.10"
    - type: lcd1602
      id: lcd1
      pins: {rs: "P1.12", e: "P1.14", d4: "P1.15", d5: "P1.13", d6: "P0.21", d7: "P0.27"}
# The displayed milliseconds must match the scenario's button->shock gap,
# with a different gap per variant, so showing any fixed "... ms" string
# fails.
scenario:
  family: timeline
  steps:
    - {delay_ms: 200}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 250}
    - set_control: {part_id: shock1, control: pressed, value: 1}
    - {delay_ms: 150}
simulation_variants:
  - id: quick_reaction
  - id: slow_reaction
    scenario:
      family: timeline
      steps:
        - {delay_ms: 200}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
        - set_control: {part_id: shock1, control: pressed, value: 1}
        - {delay_ms: 150}
    validator:
      checks:
        - {}
        - params:
            # ~700 ms gap (press start to shock); accept 640-849 ms.
            expected_regexps: ["\\b(6[4-9][0-9]|7[0-9]{2}|8[0-4][0-9])\\s*ms"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["gpio_pin_get(?:_dt|_raw)?\\s*\\(", "k_uptime_get"]
    - family: lcd_text
      params:
        expected_texts: ["ms"]
        # ~350 ms gap; accept 300-449 ms.
        expected_regexps: ["\\b(3[0-9]{2}|4[0-4][0-9])\\s*ms"]
simulation: {timeout_ms: 1500}
case: {id: reaction-timer-display-renode-nano33, sketch_name: reaction_timer_display}
