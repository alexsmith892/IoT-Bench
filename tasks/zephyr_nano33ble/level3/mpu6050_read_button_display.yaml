task_id: mpu6050_read_button_display
name: Read MPU6050 on button interrupt and display accel/gyro on LCD (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P1.14"}
      - {signal: D2, pin: "P1.15"}
      - {signal: D3, pin: "P1.13"}
      - {signal: D4, pin: "P0.21"}
      - {signal: D5, pin: "P0.27"}
  components:
    - type: button
      id: btn1
      pin: "P1.11"
    - type: mpu6050
      id: imu1
      bus: twi0
      address: "0x68"
    - type: lcd1602
      id: lcd1
      pins: {rs: "P1.12", e: "P1.14", d4: "P1.15", d5: "P1.13", d6: "P0.21", d7: "P0.27"}
# Each variant establishes a resting baseline, presses the button (LCD shows
# resting values), injects variant-specific accel/gyro, and presses again:
# the displayed raw counts must track the injection (defaults: 16384 LSB/g,
# 131 LSB/dps), so a hardcoded display fails.
scenario:
  family: timeline
  steps:
    - {delay_ms: 200}
    - set_control: {part_id: imu1, control: accelX, value: 0.0}
    - set_control: {part_id: imu1, control: accelZ, value: 1.0}
    - {delay_ms: 300}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 600}
    - set_control: {part_id: imu1, control: accelX, value: 0.5}
    - set_control: {part_id: imu1, control: rotationX, value: 30}
    - {delay_ms: 200}
    - set_control: {part_id: btn1, control: pressed, value: 1}
    - {delay_ms: 100}
    - set_control: {part_id: btn1, control: pressed, value: 0}
    - {delay_ms: 600}
simulation_variants:
  - id: half_g
  - id: one_and_half_g
    scenario:
      family: timeline
      steps:
        - {delay_ms: 200}
        - set_control: {part_id: imu1, control: accelX, value: 0.0}
        - set_control: {part_id: imu1, control: accelZ, value: 1.0}
        - {delay_ms: 300}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
        - set_control: {part_id: imu1, control: accelX, value: 1.5}
        - set_control: {part_id: imu1, control: rotationX, value: 60}
        - {delay_ms: 200}
        - set_control: {part_id: btn1, control: pressed, value: 1}
        - {delay_ms: 100}
        - set_control: {part_id: btn1, control: pressed, value: 0}
        - {delay_ms: 600}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Accel:", "Gyro:"]
                expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
              - expected_texts: ["Accel:", "Gyro:"]
                # ax ~ 1.5 g = 24576 counts, gx ~ 60 dps = 7860 counts
                expected_regexps: ["Accel:\\s*2[45][0-9]{3}", "Gyro:\\s*(7[5-9][0-9]{2}|8[01][0-9]{2})"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_any_patterns:
          - ["i2c_write_read\\s*\\(", "i2c_read\\s*\\(", "i2c_transfer\\s*\\(", "i2c_burst_read\\s*\\("]
          - ["gpio_pin_interrupt_configure", "gpio_init_callback"]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Accel:", "Gyro:"]
            expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
          - expected_texts: ["Accel:", "Gyro:"]
            # ax ~ 0.5 g = 8192 counts, gx ~ 30 dps = 3930 counts
            expected_regexps: ["Accel:\\s*8[0-3][0-9]{2}", "Gyro:\\s*(3[89][0-9]{2}|40[0-9]{2})"]
simulation: {timeout_ms: 2700}
case: {id: mpu6050-read-button-display-renode-nano33, sketch_name: mpu6050_read_button_display}
