task_id: mpu6050_read_periodic_display
name: Read MPU6050 every 100 ms, average 10 samples, display on LCD (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P1.14"}
      - {signal: D2, pin: "P1.15"}
      - {signal: D3, pin: "P1.13"}
      - {signal: D4, pin: "P0.21"}
      - {signal: D5, pin: "P0.27"}
  components:
    - type: mpu6050
      id: imu1
      bus: twi0
      address: "0x68"
    - type: lcd1602
      id: lcd1
      pins: {rs: "P1.12", e: "P1.14", d4: "P1.15", d5: "P1.13", d6: "P0.21", d7: "P0.27"}
# Each variant injects variant-specific accel/gyro mid-run; the periodically
# refreshed display must first show the resting baseline and then track the
# injected raw counts (defaults: 16384 LSB/g, 131 LSB/dps). The injected
# level is held long enough for a 10-sample (1 s) moving average to settle.
scenario:
  family: control_sequence
  initial_delay_ms: 200
  controls:
    - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
    - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 650}
    - {part_id: imu1, control: accelX, value: 0.5, duration_ms: 50}
    - {part_id: imu1, control: rotationX, value: 30, duration_ms: 1500}
simulation_variants:
  - id: half_g
  - id: one_and_half_g
    scenario:
      family: control_sequence
      initial_delay_ms: 200
      controls:
        - {part_id: imu1, control: accelX, value: 0.0, duration_ms: 50}
        - {part_id: imu1, control: accelZ, value: 1.0, duration_ms: 650}
        - {part_id: imu1, control: accelX, value: 1.5, duration_ms: 50}
        - {part_id: imu1, control: rotationX, value: 60, duration_ms: 1500}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Accel:", "Gyro:"]
                expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
              - expected_texts: ["Accel:", "Gyro:"]
                # ax ~ 1.5 g = 24576 counts, gx ~ 60 dps = 7860 counts
                expected_regexps: ["Accel:\\s*2[45][0-9]{3}", "Gyro:\\s*(7[5-9][0-9]{2}|8[01][0-9]{2})"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["k_uptime_get|k_timer_init|k_msleep"]
        required_any_patterns:
          - ["i2c_write_read\\s*\\(", "i2c_read\\s*\\(", "i2c_transfer\\s*\\(", "i2c_burst_read\\s*\\("]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Accel:", "Gyro:"]
            expected_regexps: ["Accel:\\s*-?[0-9]{1,3}\\b"]
          - expected_texts: ["Accel:", "Gyro:"]
            # ax ~ 0.5 g = 8192 counts, gx ~ 30 dps = 3930 counts
            expected_regexps: ["Accel:\\s*8[0-3][0-9]{2}", "Gyro:\\s*(3[89][0-9]{2}|40[0-9]{2})"]
simulation: {timeout_ms: 2900}
case: {id: mpu6050-read-periodic-display-renode-nano33, sketch_name: mpu6050_read_periodic_display}
