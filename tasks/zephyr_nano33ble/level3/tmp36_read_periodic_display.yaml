task_id: tmp36_read_periodic_display
name: Log TMP36 reading to LCD every second and reset on button (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P1.14"}
      - {signal: D2, pin: "P1.15"}
      - {signal: D3, pin: "P1.13"}
      - {signal: D4, pin: "P0.21"}
      - {signal: D5, pin: "P0.27"}
  components:
    - type: button
      id: btn1
      pin: "P1.11"
    - type: analog_source
      id: pot1
      channel: 0
      attrs: {value: "614"}
    - type: lcd1602
      id: lcd1
      pins: {rs: "P1.12", e: "P1.14", d4: "P1.15", d5: "P1.13", d6: "P0.21", d7: "P0.27"}
# The analog level changes mid-run, so successive 1 s log lines must show
# the counter advancing AND the raw ADC reading tracking the input. Each
# variant uses a different seed and a different mid-run level (positions at
# 4095 full scale: 0.15 -> 614, 0.50 -> 2048, 0.70 -> 2867, 0.30 -> 1229).
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
    - {value: 0.15, duration_ms: 1100}
    - {value: 0.50, duration_ms: 1200}
simulation_variants:
  - id: low_to_mid
    attrs: {pot1: {value: "614"}}
  - id: high_to_low
    attrs: {pot1: {value: "2867"}}
    scenario:
      family: analog_position_sequence
      part_id: pot1
      initial_delay_ms: 200
      positions:
        - {value: 0.70, duration_ms: 1100}
        - {value: 0.30, duration_ms: 1200}
    validator:
      checks:
        - {}
        - params:
            frames:
              - expected_texts: ["Temp #1:"]
                expected_regexps: ["\\b286[5-9](\\.\\d)?\\s*F"]
              - expected_texts: ["Temp #2:"]
              - expected_regexps: ["Temp #[23]:", "\\b12[23][0-9](\\.\\d)?\\s*F"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns: ["k_uptime_get|k_timer_init|k_msleep\\s*\\(\\s*1000"]
        required_any_patterns:
          - ["adc_read\\s*\\(", "adc_read_dt\\s*\\(", "adc_read_async\\s*\\("]
          - ["gpio_pin_interrupt_configure", "gpio_init_callback"]
    - family: lcd_text_sequence
      params:
        frames:
          - expected_texts: ["Temp #1:"]
            expected_regexps: ["\\b61[2-6](\\.\\d)?\\s*F"]
          - expected_texts: ["Temp #2:"]
          - expected_regexps: ["Temp #[23]:", "\\b204[5-9](\\.\\d)?\\s*F"]
simulation: {timeout_ms: 3100}
case: {id: tmp36-read-periodic-display-renode-nano33, sketch_name: tmp36_read_periodic_display}
