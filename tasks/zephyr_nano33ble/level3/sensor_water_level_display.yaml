task_id: sensor_water_level_display
name: Display analog water level as LCD bar graph (Zephyr / Nano 33 BLE)
platform: zephyr_nano33ble
level: level3
# The water level sensor is an SAADC channel; the level changes mid-run so
# the bar graph must track it (short bar then long bar). A second variant
# reverses the order, so a fixed frame schedule fails.
fixture:
  family: composite
  analyzer:
    channels:
      - {signal: D0, pin: "P1.12"}
      - {signal: D1, pin: "P1.14"}
      - {signal: D2, pin: "P1.15"}
      - {signal: D3, pin: "P1.13"}
      - {signal: D4, pin: "P0.21"}
      - {signal: D5, pin: "P0.27"}
  components:
    - type: water_level
      id: pot1
      channel: 0
      attrs: {position: "0.15"}
    - type: lcd1602
      id: lcd1
      pins: {rs: "P1.12", e: "P1.14", d4: "P1.15", d5: "P1.13", d6: "P0.21", d7: "P0.27"}
scenario:
  family: analog_position_sequence
  part_id: pot1
  initial_delay_ms: 200
  positions:
    - {value: 0.15, duration_ms: 450}
    - {value: 0.90, duration_ms: 650}
simulation_variants:
  - id: rising
  - id: falling
    scenario:
      family: analog_position_sequence
      part_id: pot1
      initial_delay_ms: 200
      positions:
        - {value: 0.90, duration_ms: 450}
        - {value: 0.15, duration_ms: 650}
    validator:
      checks:
        - {}
        - params:
            # deep_merge merges frame lists positionally, so both frames
            # override the base entries explicitly.
            frames:
              - {expected_texts: ["Water Level", "############"]}
              - expected_texts: ["#"]
                # A short (1-4 char) bar at a row start; (?!#) rejects the
                # long bar still being displayed.
                expected_regexps: ["\\n#{1,4}(?!#)"]
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_any_patterns:
          - ["adc_read\\s*\\(", "adc_read_dt\\s*\\(", "adc_read_async\\s*\\("]
    - family: lcd_text_sequence
      params:
        frames:
          - {expected_texts: ["Water Level"]}
          - {expected_texts: ["############"]}
simulation: {timeout_ms: 1800}
case: {id: sensor-water-level-display-renode-nano33, sketch_name: sensor_water_level_display}
