task_id: buzzer_toggle_led_freq
name: Cycle LED blink frequency on button press and beep buzzer (Zephyr)
platform: zephyr_nano33ble
level: level3
fixture:
  family: composite
  analyzer:
    channels:
      - signal: D0
        pin: "P0.16"
      - signal: D1
        pin: "P1.12"
  components:
    - type: button
      id: btn1
      pin: "P1.11"
    - type: buzzer
      id: buzzer1
      pin: "P1.12"
    - type: led
      id: led1
      pin: "P0.16"
scenario:
  family: button_press_sequence
  part_id: btn1
  initial_delay_ms: 200
  presses:
    - duration_ms: 100
      after_ms: 2500
    - duration_ms: 100
      after_ms: 1600
    - duration_ms: 100
      after_ms: 1000
    - duration_ms: 100
      after_ms: 500
validator:
  family: composite
  checks:
    - family: static_checks
      params:
        required_patterns:
          - gpio_pin_get(?:_dt|_raw)?\s*\(
          - gpio_pin_set(?:_dt|_raw)?\s*\(
          - k_uptime_get\s*\(
    - family: bus_activity
      params:
        bus: buzzer
        pins: [D1]
        min_transitions: 8
    - family: frequency_windows
      params:
        channel: D0
        windows:
          - start_s: 0.45
            end_s: 2.45
            min_valid_cycles_after_startup: 1
            skip_startup_segments: 0
            half_period_range_s: [0.4, 0.65]
            full_period_range_s: [0.8, 1.3]
          - start_s: 3.05
            end_s: 4.25
            min_valid_cycles_after_startup: 1
            skip_startup_segments: 0
            half_period_range_s: [0.18, 0.32]
            full_period_range_s: [0.36, 0.64]
          - start_s: 4.75
            end_s: 5.35
            min_valid_cycles_after_startup: 1
            skip_startup_segments: 0
            half_period_range_s: [0.09, 0.17]
            full_period_range_s: [0.18, 0.34]
          - start_s: 5.9
            end_s: 6.3
            inactive: true
            max_transitions: 1
simulation:
  timeout_ms: 6800
case:
  id: buzzer-toggle-led-freq-renode-nano33
  sketch_name: buzzer_toggle_led_freq
